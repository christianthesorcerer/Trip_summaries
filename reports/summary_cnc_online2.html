		          '<span class="pill">Add to receipt</span>' + (bought && markedChannel ? ('<span class="pill" style="margin-left:6px;">' + esc(markedChannel) + '</span>') : ''),
		          '</label>',
		          '</span></div>',
		        ].join('');
		        const cardHtml = isAmazon
		          ? [
		              '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">',
		              '<h4>' + headerTitle + '</h4>',
		              '<div style="display:flex;gap:6px;align-items:center;">' + tags.join('') + '</div>',
		              '</div>',
		              qtyRow,
		              buyRow,
		              '<div class="row"><span>Keepa</span><span class="price" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">',
		              '<span>Rank: ' + rankVal(keepaRank) + '</span>',
		              '<span>Past month: ' + boughtVal(keepaBought) + '</span>',
		              '<a class="pill link-btn" href="' + keepaLink + '" target="_blank">' + (r.keepa?.asin || 'Keepa') + '</a>',
	              '</span></div>',
              '<div class="row"><span>Keepa price</span><span class="price">' + fmt(r.keepa?.price ?? null) + '</span></div>',
              '<div class="row"><span>UPC</span><span class="pill">' + (r.upc || '-') + '</span></div>',
              '<div class="row"><span>Turbo price</span><span class="price">' + fmt(r.price) + '</span></div>',
              '<div class="row"><span>Discount</span><span class="price">' + pct(r.discountPct) + '</span></div>',
              '<div class="row"><span>Floor stock</span><span class="pill">' + (r.floor ?? '-') + '</span></div>',
              '<div class="row"><span>Back stock</span><span class="pill">' + (r.back ?? '-') + '</span></div>',
		              '<div class="row"><span>Links</span>',
		              '<a class="pill link-btn" style="margin-left:8px;" href="' + walmartLink + '" target="_blank">Walmart</a>',
		              '</div>'
		            ].join('')
		          : [
		              '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">',
		              '<h4>' + headerTitle + '</h4>',
		              '<div style="display:flex;gap:6px;align-items:center;">' + tags.join('') + '</div>',
		              '</div>',
		              qtyRow,
		              buyRow,
		              '<div class="row"><span>Turbo price</span><span class="price">' + fmt(r.price) + '</span></div>',
		              '<div class="row"><span>Marter price</span><span class="price">' + fmt(r.marterPrice) + '</span></div>',
		              '<div class="row"><span>Discount</span><span class="price">' + pct(r.discountPct) + '</span></div>',
	              '<div class="row"><span>Floor stock</span><span class="pill">' + (r.floor ?? '-') + '</span></div>',
              '<div class="row"><span>Back stock</span><span class="pill">' + (r.back ?? '-') + '</span></div>',
              '<div class="row"><span>Aisles</span><span class="pill">' + (r.aisles || 'N/A') + '</span></div>',
	              '<div class="row"><span>Item</span>',
	              '<span class="pill">' + (r.itemId || '-') + '</span>',
		              '<a class="pill link-btn" style="margin-left:8px;" href="' + walmartLink + '" target="_blank">Walmart link</a>',
		              '</div>'
		            ].join('');
		        card.innerHTML = cardHtml;
		        // Update snapshot in receipt state so Receipt tab can render even if filters hide this card.
		        receiptState.items[receiptKey] = {
		          receiptKey,
		          itemId: r.itemId || null,
		          upc: r.upc || null,
		          storeId: r.storeId || null,
		          storeLine: r.storeLine || null,
		          address: r.address || null,
		          price: r.price ?? null,
		          marterPrice: r.marterPrice ?? null,
		          keepaPrice: (r.keepa && r.keepa.found) ? (r.keepa.price ?? null) : null,
		          keepaUrl: (r.keepa && (r.keepa.keepaUrl || (r.keepa.asin && ('https://keepa.com/#!product/1-' + r.keepa.asin)))) || null,
		          sourceLink: r.sourceLink || null,
		          walmartLink: walmartLink,
		          discountPct: r.discountPct ?? null,
		          fulfillment: r.fulfillment || null,
		        };
		        saveReceiptStateSoon();

		        function updateCardEstimates() {
		          const input = card.querySelector('.qty-input');
		          const qtyVal = Number.parseInt((input && input.value) ? input.value : '1', 10);
		          const q = Number.isFinite(qtyVal) && qtyVal > 0 ? qtyVal : 1;
		          qtyByItem.set(receiptKey, q);
		          receiptState.qty[receiptKey] = q;
		          saveReceiptStateSoon();
		          const costUnit = r.price != null ? Number(r.price) : null;
		          const salesUnit = currentView === 'amazon'
		            ? ((r.keepa && r.keepa.found && r.keepa.price != null) ? Number(r.keepa.price) : null)
		            : (r.marterPrice != null ? Number(r.marterPrice) : null);
	          const fmtMoney = (n) => (n == null || !Number.isFinite(n)) ? '–' : '$' + n.toFixed(2);
	          const cost = costUnit != null ? costUnit * q : null;
	          const sales = salesUnit != null ? salesUnit * q : null;
		          const costEl = card.querySelector('.est-cost');
		          const salesEl = card.querySelector('.est-sales');
		          if (costEl) costEl.textContent = fmtMoney(cost);
		          if (salesEl) salesEl.textContent = fmtMoney(sales);
		        }
		        const qtyInput = card.querySelector('.qty-input');
		        if (qtyInput) qtyInput.addEventListener('input', updateCardEstimates);
		        const boughtToggle = card.querySelector('.bought-toggle');
		        if (boughtToggle) {
		          boughtToggle.addEventListener('change', () => {
		            const checked = !!boughtToggle.checked;
		            receiptState.bought[receiptKey] = checked;
		            if (checked) receiptState.channel[receiptKey] = (currentView === 'amazon' ? 'Amazon view' : 'Walmart view');
		            else delete receiptState.channel[receiptKey];
		            saveReceiptStateSoon();
		          });
		        }
		        updateCardEstimates();
		        root.appendChild(card);
		      });
		    }

	    function renderReceipt() {
	      if (!receiptRoot) return;
		      const entries = [];
		      const boughtMap = receiptState.bought || {};
		      const itemsMap = receiptState.items || {};
		      const channelMap = receiptState.channel || {};
		      Object.keys(boughtMap).forEach((k) => {
		        if (!boughtMap[k]) return;
		        const snap = itemsMap[k];
		        if (!snap) return;
		        const qRaw = receiptState.qty && receiptState.qty[k] != null ? receiptState.qty[k] : 1;
		        const q = Number.parseInt(String(qRaw), 10);
		        entries.push({ ...snap, qty: Number.isFinite(q) && q > 0 ? q : 1, channel: channelMap[k] || null });
		      });

		      // Sort by highest discount then store label.
		      entries.sort((a, b) => {
		        const da = a.discountPct == null ? -Infinity : Number(a.discountPct);
		        const db = b.discountPct == null ? -Infinity : Number(b.discountPct);
		        if (db !== da) return db - da;
		        return String(a.storeLine || a.storeId || "").localeCompare(String(b.storeLine || b.storeId || ""));
		      });

		      const fmtMoney = (n) => (n == null || !Number.isFinite(n)) ? '–' : '$' + Number(n).toFixed(2);
		      const totalQty = entries.reduce((a, e) => a + (e.qty || 0), 0);
		      const totalCost = entries.reduce((a, e) => a + ((Number(e.price) || 0) * (e.qty || 0)), 0);
		      const totalSales = entries.reduce((a, e) => {
		        const unit = (e.keepaPrice != null && Number.isFinite(Number(e.keepaPrice))) ? Number(e.keepaPrice)
		          : (e.marterPrice != null && Number.isFinite(Number(e.marterPrice))) ? Number(e.marterPrice)
		          : 0;
		        return a + unit * (e.qty || 0);
		      }, 0);
	      const profit = totalSales - totalCost;

	      function toast(msg) {
	        try {
	          const el = document.createElement('div');
	          el.className = 'toast';
	          el.textContent = msg;
	          document.body.appendChild(el);
	          setTimeout(() => el.remove(), 1800);
	        } catch (_) {}
	      }

	      function tsvCell(v) {
	        const s = v == null ? '' : String(v);
	        // Note: this is emitted into an inline <script> inside a template literal, so escape backslashes
	        // to avoid CR/LF escape sequences becoming real line breaks in the generated HTML (which breaks the regex literal).
	        return s.replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
	      }
		      function csvCell(v) {
		        const s = v == null ? '' : String(v);
		        const escaped = s.replace(/"/g, '""');
		        return '"' + escaped + '"';
		      }
	      function buildExportRows() {
	        return entries.map((e) => {
	          const unitSales = (e.keepaPrice != null && Number.isFinite(Number(e.keepaPrice))) ? Number(e.keepaPrice)
	            : (e.marterPrice != null && Number.isFinite(Number(e.marterPrice))) ? Number(e.marterPrice)
	            : null;
	          const unitCost = (e.price != null && Number.isFinite(Number(e.price))) ? Number(e.price) : null;
	          const qty = Number(e.qty) || 0;
	          const totalCost = unitCost != null ? unitCost * qty : null;
	          const totalSales = unitSales != null ? unitSales * qty : null;
	          const estProfit = (totalSales != null && totalCost != null) ? (totalSales - totalCost) : null;
	          return {
	            tripName: data.tripName || '',
	            tripId: data.tripId || '',
	            runId: data.runId || '',
	            markedIn: e.channel || '',
	            store: e.storeLine || (e.storeId ? ('Store #' + e.storeId) : ''),
	            itemLink: e.walmartLink || '',
	            itemId: e.itemId || '',
	            upc: e.upc || '',
	            qty,
	            costPerItem: unitCost != null ? unitCost.toFixed(2) : '',
	            totalCost: totalCost != null ? totalCost.toFixed(2) : '',
	            salesPerItem: unitSales != null ? unitSales.toFixed(2) : '',
	            totalSales: totalSales != null ? totalSales.toFixed(2) : '',
	            estProfit: estProfit != null ? estProfit.toFixed(2) : '',
	            discountPct: e.discountPct != null ? Number(e.discountPct).toFixed(2) : '',
	            marterPrice: e.marterPrice != null ? Number(e.marterPrice).toFixed(2) : '',
	            keepaPrice: e.keepaPrice != null ? Number(e.keepaPrice).toFixed(2) : '',
	            keepaUrl: e.keepaUrl || '',
	          };
	        });
	      }
	      function exportTsv() {
	        const rows = buildExportRows();
	        const headers = [
	          'Trip name','Trip ID','Run ID','Marked in','Store',
	          'Item link','Item ID','UPC',
	          'Cost per item','Total cost','Total quantity bought',
	          'Sales per item','Est. sales','Est. profit',
	          'Discount %','Marter price','Keepa price','Keepa link',
	        ];
	        const lines = [headers.join('\t')];
	        rows.forEach((r) => {
	          const line = [
	            r.tripName, r.tripId, r.runId, r.markedIn, r.store,
	            r.itemLink, r.itemId, r.upc,
	            r.costPerItem, r.totalCost, r.qty,
	            r.salesPerItem, r.totalSales, r.estProfit,
	            r.discountPct, r.marterPrice, r.keepaPrice, r.keepaUrl,
	          ].map(tsvCell).join('\t');
	          lines.push(line);
	        });
	        const txt = lines.join('\n');
	        (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject())
	          .then(() => toast('Copied for Google Sheets'))
	          .catch(() => {
	            // Fallback: prompt
	            try { window.prompt('Copy to clipboard:', txt); } catch (_) {}
	          });
	      }
	      function exportCsv() {
	        const rows = buildExportRows();
	        const headers = [
	          'Trip name','Trip ID','Run ID','Marked in','Store',
	          'Item link','Item ID','UPC',
	          'Cost per item','Total cost','Total quantity bought',
	          'Sales per item','Est. sales','Est. profit',
	          'Discount %','Marter price','Keepa price','Keepa link',
	        ];
	        const lines = [headers.map(csvCell).join(',')];
	        rows.forEach((r) => {
	          lines.push([
	            r.tripName, r.tripId, r.runId, r.markedIn, r.store,
	            r.itemLink, r.itemId, r.upc,
	            r.costPerItem, r.totalCost, r.qty,
	            r.salesPerItem, r.totalSales, r.estProfit,
	            r.discountPct, r.marterPrice, r.keepaPrice, r.keepaUrl,
	          ].map(csvCell).join(','));
	        });
	        const csv = lines.join('\n');
	        try {
	          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
	          const url = URL.createObjectURL(blob);
		          const a = document.createElement('a');
		          const safe = String(data.tripName || 'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
		          a.href = url;
		          a.download = 'receipt-' + (safe || 'trip') + '.csv';
		          document.body.appendChild(a);
	          a.click();
	          a.remove();
	          setTimeout(() => URL.revokeObjectURL(url), 1000);
	          toast('Downloaded CSV');
	        } catch (_) {}
	      }
	      const rows = entries.map((e) => {
		        const unitSales = (e.keepaPrice != null && Number.isFinite(Number(e.keepaPrice))) ? Number(e.keepaPrice)
		          : (e.marterPrice != null && Number.isFinite(Number(e.marterPrice))) ? Number(e.marterPrice)
		          : null;
		        const cost = (Number(e.price) || 0) * (e.qty || 0);
		        const sales = unitSales != null ? unitSales * (e.qty || 0) : null;
		        const storeTitle = e.storeLine || (e.storeId ? ('Store #' + e.storeId) : 'Store');
		        return [
		          '<tr>',
		          '<td>',
		          '<div style="font-weight:800;">' + esc(storeTitle) + '</div>',
		          '<div class="meta" style="margin-top:3px;">' + (e.itemId ? ('Item ' + esc(e.itemId)) : '') + '</div>',
		          '<div class="meta" style="margin-top:3px;">' + (e.discountPct != null ? ('Discount ' + Number(e.discountPct).toFixed(1) + '%') : '') + '</div>',
		          '<div style="margin-top:6px;">' +
		            (e.walmartLink ? '<a class="link-btn" href="' + esc(e.walmartLink) + '" target="_blank">Walmart</a>' : '') +
		            (e.keepaUrl ? '<a class="link-btn" style="margin-left:6px;" href="' + esc(e.keepaUrl) + '" target="_blank">Keepa</a>' : '') +
		            '</div>',
		          '</td>',
		          '<td>' + (e.channel ? ('<span class="pill">' + esc(e.channel) + '</span>') : '<span class="meta">–</span>') + '</td>',
		          '<td class="num"><input data-receipt-qty="' + esc(e.receiptKey) + '" class="qty-input" type="number" min="1" step="1" inputmode="numeric" value="' + String(e.qty) + '" /></td>',
		          '<td class="num">' + fmtMoney(e.price) + '</td>',
		          '<td class="num">' + fmtMoney(cost) + '</td>',
		          '<td class="num">' + fmtMoney(unitSales) + '</td>',
		          '<td class="num">' + fmtMoney(sales) + '</td>',
		          '<td class="num"><button data-receipt-remove="' + esc(e.receiptKey) + '" class="toggle-btn" style="padding:6px 10px;">Remove</button></td>',
		          '</tr>',
		        ].join('');
		      }).join('');

		      receiptRoot.innerHTML = [
		        '<h3>Receipt (this trip)</h3>',
		        '<div class="receipt-actions">' +
		          '<button id="receipt-copy" class="toggle-btn">Copy to Google Sheets</button>' +
		          '<button id="receipt-csv" class="toggle-btn">Download CSV</button>' +
		        '</div>',
		        '<div class="receipt-totals">',
		        '<div class="receipt-total"><div class="k">Items checked</div><div class="v">' + String(entries.length) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Total qty</div><div class="v">' + String(totalQty) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Total cost</div><div class="v">' + fmtMoney(totalCost) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Est. sales</div><div class="v">' + fmtMoney(totalSales) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Est. profit</div><div class="v">' + fmtMoney(profit) + '</div></div>',
		        '</div>',
		        entries.length ? (
		          '<table class="receipt-table"><thead><tr>' +
		          '<th>Item</th><th>Marked in</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Cost</th><th class="num">Unit sales</th><th class="num">Sales</th><th class="num"></th>' +
		          '</tr></thead><tbody>' + rows + '</tbody></table>'
		        ) : '<div class="meta">No items checked yet. Check “Add to receipt” on an item card.</div>'
		      ].join('');

		      const copyBtn = document.getElementById('receipt-copy');
		      if (copyBtn) copyBtn.addEventListener('click', exportTsv);
		      const csvBtn = document.getElementById('receipt-csv');
		      if (csvBtn) csvBtn.addEventListener('click', exportCsv);

		      Array.from(receiptRoot.querySelectorAll('input[data-receipt-qty]')).forEach((inp) => {
		        inp.addEventListener('input', () => {
		          const k = inp.getAttribute('data-receipt-qty');
		          const n = Number.parseInt(inp.value || '1', 10);
		          const q = Number.isFinite(n) && n > 0 ? n : 1;
		          receiptState.qty[k] = q;
		          saveReceiptStateSoon();
		          renderReceipt();
		        });
		      });
			      Array.from(receiptRoot.querySelectorAll('button[data-receipt-remove]')).forEach((btn) => {
			        btn.addEventListener('click', () => {
			          const k = btn.getAttribute('data-receipt-remove');
			          receiptState.bought[k] = false;
			          delete receiptState.channel[k];
			          saveReceiptStateSoon();
			          renderReceipt();
			        });
			      });
			      setStatus('Receipt items: ' + String(entries.length));
			    }
			    function renderGambles() {
		      if (!gambleRoot) return;
		      gambleRoot.innerHTML = '';
		      if (!gambles.length) {
	        const empty = document.createElement('div');
	        empty.className = 'meta';
	        empty.textContent = 'No Low/N/A gambles captured';
	        gambleRoot.appendChild(empty);
	        return;
	      }
		      const storeValue = (gamblesStoreFilter && gamblesStoreFilter.value) || (storeFilter && storeFilter.value) || 'all';
		      const filtered = gambles
		        .filter((r) => {
		          if (storeValue === 'all') return true;
		          const storeText = ((r.storeLine || '') + ' ' + (r.address || '')).toLowerCase();
	          return storeText.includes(String(storeValue).toLowerCase());
	        })
	        .slice()
	        .sort((a, b) => {
	          const aStore = String(a.storeLine || a.address || '').toLowerCase();
	          const bStore = String(b.storeLine || b.address || '').toLowerCase();
	          if (aStore < bStore) return -1;
	          if (aStore > bStore) return 1;
	          const aId = Number.parseInt(String(a.itemId || ''), 10);
	          const bId = Number.parseInt(String(b.itemId || ''), 10);
	          if (Number.isFinite(aId) && Number.isFinite(bId)) return aId - bId;
	          return String(a.itemId || '').localeCompare(String(b.itemId || ''));
	        });

		      if (!filtered.length) {
		        const empty = document.createElement('div');
		        empty.className = 'meta';
		        empty.textContent = 'No Low/N/A gambles match the current store filter';
		        gambleRoot.appendChild(empty);
		        return;
		      }
		      const storeCounts = new Map();
		      filtered.forEach((r) => {
		        const title = String(r.storeLine || r.address || 'Store');
		        const key = title.toLowerCase();
		        storeCounts.set(key, (storeCounts.get(key) || 0) + 1);
		      });
		      let lastStoreKey = null;
		      filtered.forEach((r) => {
		        const card = document.createElement('div');
		        card.className = 'card';
		        const walmartLink = r.itemId ? 'https://www.walmart.com/ip/' + r.itemId : (r.sourceLink || '#');
		        const storeTitle = String(r.storeLine || r.address || 'Store');
		        const storeKey = storeTitle.toLowerCase();
		        if (storeKey !== lastStoreKey) {
		          lastStoreKey = storeKey;
		          const header = document.createElement('div');
		          header.style.cssText =
		            'margin:10px 0 6px;padding:10px 12px;border-radius:12px;border:1px solid #1f2937;background:#0f172a;font-weight:800;';
		          header.textContent = storeTitle + ' (' + String(storeCounts.get(storeKey) || 0) + ')';
		          gambleRoot.appendChild(header);
		        }
		        const cardHtml = [
		          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">',
	          '<h4>' + (r.storeLine || 'Store') + '</h4>',
	          '<span class="tag gamble">Low/N/A gambles</span>',
	          '</div>',
	          '<div class="row"><span>Turbo price</span><span class="price">' + fmt(r.price) + '</span></div>',
          '<div class="row"><span>Floor stock</span><span class="pill">' + (r.floor ?? '–') + '</span></div>',
          '<div class="row"><span>Back stock</span><span class="pill">' + (r.back ?? '–') + '</span></div>',
          '<div class="row"><span>Aisles</span><span class="pill">' + (r.aisles || 'N/A') + '</span></div>',
          '<div class="row"><span>Item</span>',
          '<span class="pill">' + (r.itemId || '–') + '</span>',
          '<a class="pill link-btn" style="margin-left:8px;" href="' + walmartLink + '" target="_blank">Walmart link</a>',
          '</div>'
	        ].join('');
	        card.innerHTML = cardHtml;
	        gambleRoot.appendChild(card);
	      });
	    }
    function applyFulfillmentUIFilter() {
      const mode = (fulfillmentFilter && fulfillmentFilter.value) || 'all';
      const cards = Array.from(root.querySelectorAll('.card'));
      cards.forEach((card) => {
        const hasPickup = !!card.querySelector('.tag.pickup');
        const hasDelivery = !!card.querySelector('.tag.delivery');
        let show = true;
        if (mode === 'pickup') show = hasPickup;
        else if (mode === 'delivery') show = hasDelivery;
        else if (mode === 'both') show = hasPickup && hasDelivery;
        else if (mode === 'instore') show = !hasPickup && !hasDelivery;
        card.style.display = show ? '' : 'none';
      });
    }

    const fulfillmentFilter = document.getElementById('fulfillment-filter');
		    const _applyFilters = applyFilters;
		    applyFilters = function () {
		      _applyFilters();
		      applyFulfillmentUIFilter();
		    };

		    applyFilters();
		    discountFilter.addEventListener('input', applyFilters);
		    floorFilter.addEventListener('input', applyFilters);
		    backFilter.addEventListener('input', applyFilters);
		    aisleFilter.addEventListener('change', applyFilters);
		    storeFilter.addEventListener('change', applyFilters);
		    if (gamblesStoreFilter) {
		      gamblesStoreFilter.addEventListener('change', () => {
		        if (storeFilter) storeFilter.value = gamblesStoreFilter.value || 'all';
		        if (currentView === 'gambles') renderGambles();
		      });
		    }
		    if (fulfillmentFilter) fulfillmentFilter.addEventListener('change', applyFilters);
	  </script>
	</body>
	</html>
