        // Stock filter: if both provided, accept if EITHER meets the threshold; if only one provided, apply that one.
        if (minFloor != null && minBack != null) {
          const floorOk = r.floor != null && r.floor >= minFloor;
          const backOk = r.back != null && r.back >= minBack;
          if (!floorOk && !backOk) return false;
        } else if (minFloor != null) {
          if (r.floor == null || r.floor < minFloor) return false;
        } else if (minBack != null) {
          if (r.back == null || r.back < minBack) return false;
        }
        const ais = (r.aisles || '').trim();
        const isNA = !ais || new RegExp('^n/?a$', 'i').test(ais);
        if (aisleValue === 'na' && !isNA) return false;
        if (aisleValue === 'has' && isNA) return false;
        if (aisleValue.length === 1 && aisleValue !== 'all') {
          if (!ais.toUpperCase().startsWith(aisleValue)) return false;
        }
        if (storeValue !== 'all') {
          const storeText = ((r.storeLine || '') + ' ' + (r.address || '')).toLowerCase();
          if (!storeText.includes(storeValue.toLowerCase())) return false;
        }
	        return true;
	      });
	      renderItems(filtered);
	    }
	    Object.entries(viewButtons).forEach(([mode, btn]) => {
	      if (!btn) return;
	      btn.addEventListener('click', () => {
	        currentView = mode;
	        viewButtons.walmart.classList.toggle('active', mode === 'walmart');
	        viewButtons.amazon.classList.toggle('active', mode === 'amazon');
	        viewButtons.receipt.classList.toggle('active', mode === 'receipt');
	        applyFilters();
	      });
	    });
    function buildAisleOptions() {
      const letters = new Set();
      data.results.forEach((r) => {
        const ais = (r.aisles || '').trim();
        if (ais && !new RegExp('^n/?a$', 'i').test(ais)) {
          letters.add(ais[0].toUpperCase());
        }
      });
      const opts = [
        { value: 'all', label: 'All aisles' },
        { value: 'has', label: 'Has aisle' },
        { value: 'na', label: 'N/A only' },
        ...Array.from(letters).sort().map((l) => ({ value: l, label: 'Starts with ' + l })),
      ];
      aisleFilter.innerHTML = opts.map((o) => '<option value="' + o.value + '">' + o.label + '</option>').join('');
      aisleFilter.value = 'all';
    }
    function buildStoreOptions() {
      const storeMap = new Map();
      data.results.forEach((r) => {
        if (!r.pass) return;
        const hasStock = (r.floor ?? 0) > 0 || (r.back ?? 0) > 0;
        if (!hasStock) return;
        const key = (r.storeLine || r.address || '').trim();
        if (!key) return;
        const label = (r.storeLine ? r.storeLine : key) + (r.address ? ' — ' + r.address : '');
        storeMap.set(key.toLowerCase(), label);
      });
      const opts = [{ value: 'all', label: 'All stores' }].concat(
        Array.from(storeMap.entries()).map(([val, label]) => ({ value: val, label }))
      );
      storeFilter.innerHTML = opts.map((o) => '<option value="' + o.value + '">' + o.label + '</option>').join('');
      storeFilter.value = 'all';
    }
    // Optional quick reset
    const resetBtn = document.createElement('button');
    resetBtn.textContent = 'Reset filters';
    resetBtn.style.cssText = 'width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid #1f2937;background:#0f172a;color:#e2e8f0;cursor:pointer;';
    resetBtn.onclick = () => {
      discountFilter.value = '';
      floorFilter.value = '';
      backFilter.value = '';
      aisleFilter.value = 'all';
      storeFilter.value = 'all';
      applyFilters();
    };
    document.querySelector('.sidebar').appendChild(resetBtn);
	    function fmt(n) { return n == null ? '-' : '$' + n.toFixed(2); }
	    function pct(n) { return n == null ? '-' : n.toFixed(1) + '%'; }
    function rankVal(n) { return n == null ? '-' : '#' + Number(n).toLocaleString(); }
    function boughtVal(v) {
      if (v == null) return '-';
      if (typeof v === 'number') return Number(v).toLocaleString();
      return String(v);
    }
		    function renderItems(list) {
		      root.innerHTML = '';
		      const dataset = (list || data.results.filter(r => r.pass)).filter((r) => currentView === 'amazon' ? (r.keepa && r.keepa.found) : true);
		      dataset.forEach((r) => {
		        const card = document.createElement('div');
		        card.className = 'card';
		        const receiptKey = [
		          (data.tripId || data.tripName || 'trip'),
		          (data.runId || ''),
		          (r.itemId || ''),
		          (r.storeId || ''),
		          (r.sourceLink || ''),
		        ].join('||');
		        const initialQtyRaw = receiptState.qty && receiptState.qty[receiptKey] != null ? receiptState.qty[receiptKey] : (qtyByItem.get(receiptKey) ?? defaultQty);
		        const initialQty = Number.parseInt(String(initialQtyRaw), 10);
		        const qty = Number.isFinite(initialQty) && initialQty > 0 ? initialQty : defaultQty;
		        qtyByItem.set(receiptKey, qty);
		        receiptState.qty[receiptKey] = qty;
		        const bought = !!(receiptState.bought && receiptState.bought[receiptKey]);
		        const walmartLink = r.itemId ? 'https://www.walmart.com/ip/' + r.itemId : (r.sourceLink || '#');
		        const keepaLink =
		          (r.keepa && (r.keepa.keepaUrl || (r.keepa.asin && 'https://keepa.com/#!product/1-' + r.keepa.asin))) ||
		          (r.upc ? 'https://keepa.com/#!search/1-' + r.upc : '#');
        const tags = ['<span class="tag pass">PASS</span>'];
        if (r.lowNAGamble) tags.push('<span class="tag gamble">Low/N/A gambles</span>');
        if (r.keepa && r.keepa.found) tags.push('<span class="tag amazon">Amazon</span>');

        const f = r.fulfillment || null;
        if (!f || (f.pickup == null && f.delivery == null)) {
          const label = f && f.status === 'BLOCKED'
            ? '<span class="tag blocked">BLOCKED</span>'
            : '<span class="tag unknown">Fulfillment unknown</span>';
          tags.push(label);
        } else {
          if (f.pickup === true) tags.push('<span class="tag pickup">Pickup</span>');
          if (f.delivery === true) tags.push('<span class="tag delivery">Delivery</span>');
        }
        const isAmazon = currentView === 'amazon';
        const storeTitle = r.storeLine || (r.storeId ? ('Store #' + r.storeId) : null);
        const headerTitle = isAmazon
          ? ((storeTitle ? (storeTitle + ' — ') : '') + (r.keepa?.title || 'Keepa item'))
          : (storeTitle || 'Store');
		        const keepaRank = r.keepa?.data?.salesRankCurrent ?? r.keepa?.data?.salesRankAvg30 ?? null;
		        const keepaBought = r.keepa?.data?.boughtInPastMonth ?? null;
		        const qtyRow = [
		          '<div class="row"><span>Quantity</span>',
		          '<span class="est">',
		          '<input class="qty-input" type="number" min="1" step="1" inputmode="numeric" value="' + String(qty) + '" />',
		          '<span class="pill">Est cost <b class="est-cost" style="color:var(--text)"></b></span>',
		          '<span class="pill">Est sales <b class="est-sales" style="color:var(--text)"></b></span>',
		          '</span></div>',
		        ].join('');
		        const buyRow = [
		          '<div class="row"><span>Bought</span>',
		          '<span class="buy">',
		          '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">',
		          '<input class="bought-toggle" type="checkbox"' + (bought ? ' checked' : '') + ' />',
		          '<span class="pill">Add to receipt</span>',
		          '</label>',
		          '</span></div>',
		        ].join('');
		        const cardHtml = isAmazon
		          ? [
		              '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">',
		              '<h4>' + headerTitle + '</h4>',
		              '<div style="display:flex;gap:6px;align-items:center;">' + tags.join('') + '</div>',
		              '</div>',
		              qtyRow,
		              buyRow,
		              '<div class="row"><span>Keepa</span><span class="price" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">',
		              '<span>Rank: ' + rankVal(keepaRank) + '</span>',
		              '<span>Past month: ' + boughtVal(keepaBought) + '</span>',
		              '<a class="pill link-btn" href="' + keepaLink + '" target="_blank">' + (r.keepa?.asin || 'Keepa') + '</a>',
	              '</span></div>',
              '<div class="row"><span>Keepa price</span><span class="price">' + fmt(r.keepa?.price ?? null) + '</span></div>',
              '<div class="row"><span>UPC</span><span class="pill">' + (r.upc || '-') + '</span></div>',
              '<div class="row"><span>Turbo price</span><span class="price">' + fmt(r.price) + '</span></div>',
              '<div class="row"><span>Discount</span><span class="price">' + pct(r.discountPct) + '</span></div>',
              '<div class="row"><span>Floor stock</span><span class="pill">' + (r.floor ?? '-') + '</span></div>',
              '<div class="row"><span>Back stock</span><span class="pill">' + (r.back ?? '-') + '</span></div>',
		              '<div class="row"><span>Links</span>',
		              '<a class="pill link-btn" style="margin-left:8px;" href="' + walmartLink + '" target="_blank">Walmart</a>',
		              '</div>'
		            ].join('')
		          : [
		              '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">',
		              '<h4>' + headerTitle + '</h4>',
		              '<div style="display:flex;gap:6px;align-items:center;">' + tags.join('') + '</div>',
		              '</div>',
		              qtyRow,
		              buyRow,
		              '<div class="row"><span>Turbo price</span><span class="price">' + fmt(r.price) + '</span></div>',
		              '<div class="row"><span>Marter price</span><span class="price">' + fmt(r.marterPrice) + '</span></div>',
		              '<div class="row"><span>Discount</span><span class="price">' + pct(r.discountPct) + '</span></div>',
	              '<div class="row"><span>Floor stock</span><span class="pill">' + (r.floor ?? '-') + '</span></div>',
              '<div class="row"><span>Back stock</span><span class="pill">' + (r.back ?? '-') + '</span></div>',
              '<div class="row"><span>Aisles</span><span class="pill">' + (r.aisles || 'N/A') + '</span></div>',
	              '<div class="row"><span>Item</span>',
	              '<span class="pill">' + (r.itemId || '-') + '</span>',
		              '<a class="pill link-btn" style="margin-left:8px;" href="' + walmartLink + '" target="_blank">Walmart link</a>',
		              '</div>'
		            ].join('');
		        card.innerHTML = cardHtml;
		        // Update snapshot in receipt state so Receipt tab can render even if filters hide this card.
		        receiptState.items[receiptKey] = {
		          receiptKey,
		          itemId: r.itemId || null,
		          storeId: r.storeId || null,
		          storeLine: r.storeLine || null,
		          address: r.address || null,
		          price: r.price ?? null,
		          marterPrice: r.marterPrice ?? null,
		          keepaPrice: (r.keepa && r.keepa.found) ? (r.keepa.price ?? null) : null,
		          keepaUrl: (r.keepa && (r.keepa.keepaUrl || (r.keepa.asin && ('https://keepa.com/#!product/1-' + r.keepa.asin)))) || null,
		          sourceLink: r.sourceLink || null,
		          walmartLink: walmartLink,
		          discountPct: r.discountPct ?? null,
		          fulfillment: r.fulfillment || null,
		        };
		        saveReceiptStateSoon();

		        function updateCardEstimates() {
		          const input = card.querySelector('.qty-input');
		          const qtyVal = Number.parseInt((input && input.value) ? input.value : '1', 10);
		          const q = Number.isFinite(qtyVal) && qtyVal > 0 ? qtyVal : 1;
		          qtyByItem.set(receiptKey, q);
		          receiptState.qty[receiptKey] = q;
		          saveReceiptStateSoon();
		          const costUnit = r.price != null ? Number(r.price) : null;
		          const salesUnit =
		            (r.keepa && r.keepa.found && r.keepa.price != null) ? Number(r.keepa.price) :
		            (r.marterPrice != null ? Number(r.marterPrice) : null);
	          const fmtMoney = (n) => (n == null || !Number.isFinite(n)) ? '–' : '$' + n.toFixed(2);
	          const cost = costUnit != null ? costUnit * q : null;
	          const sales = salesUnit != null ? salesUnit * q : null;
		          const costEl = card.querySelector('.est-cost');
		          const salesEl = card.querySelector('.est-sales');
		          if (costEl) costEl.textContent = fmtMoney(cost);
		          if (salesEl) salesEl.textContent = fmtMoney(sales);
		        }
		        const qtyInput = card.querySelector('.qty-input');
		        if (qtyInput) qtyInput.addEventListener('input', updateCardEstimates);
		        const boughtToggle = card.querySelector('.bought-toggle');
		        if (boughtToggle) {
		          boughtToggle.addEventListener('change', () => {
		            receiptState.bought[receiptKey] = !!boughtToggle.checked;
		            saveReceiptStateSoon();
		          });
		        }
		        updateCardEstimates();
		        root.appendChild(card);
		      });
		    }

		    function renderReceipt() {
		      if (!receiptRoot) return;
		      const entries = [];
		      const boughtMap = receiptState.bought || {};
		      const itemsMap = receiptState.items || {};
		      Object.keys(boughtMap).forEach((k) => {
		        if (!boughtMap[k]) return;
		        const snap = itemsMap[k];
		        if (!snap) return;
		        const qRaw = receiptState.qty && receiptState.qty[k] != null ? receiptState.qty[k] : 1;
		        const q = Number.parseInt(String(qRaw), 10);
		        entries.push({ ...snap, qty: Number.isFinite(q) && q > 0 ? q : 1 });
		      });

		      // Sort by highest discount then store label.
		      entries.sort((a, b) => {
		        const da = a.discountPct == null ? -Infinity : Number(a.discountPct);
		        const db = b.discountPct == null ? -Infinity : Number(b.discountPct);
		        if (db !== da) return db - da;
		        return String(a.storeLine || a.storeId || "").localeCompare(String(b.storeLine || b.storeId || ""));
		      });

		      const fmtMoney = (n) => (n == null || !Number.isFinite(n)) ? '–' : '$' + Number(n).toFixed(2);
		      const totalQty = entries.reduce((a, e) => a + (e.qty || 0), 0);
		      const totalCost = entries.reduce((a, e) => a + ((Number(e.price) || 0) * (e.qty || 0)), 0);
		      const totalSales = entries.reduce((a, e) => {
		        const unit = (e.keepaPrice != null && Number.isFinite(Number(e.keepaPrice))) ? Number(e.keepaPrice)
		          : (e.marterPrice != null && Number.isFinite(Number(e.marterPrice))) ? Number(e.marterPrice)
		          : 0;
		        return a + unit * (e.qty || 0);
		      }, 0);
		      const profit = totalSales - totalCost;

		      const rows = entries.map((e) => {
		        const unitSales = (e.keepaPrice != null && Number.isFinite(Number(e.keepaPrice))) ? Number(e.keepaPrice)
		          : (e.marterPrice != null && Number.isFinite(Number(e.marterPrice))) ? Number(e.marterPrice)
		          : null;
		        const cost = (Number(e.price) || 0) * (e.qty || 0);
		        const sales = unitSales != null ? unitSales * (e.qty || 0) : null;
		        const storeTitle = e.storeLine || (e.storeId ? ('Store #' + e.storeId) : 'Store');
		        return [
		          '<tr>',
		          '<td>',
		          '<div style="font-weight:800;">' + escapeHtml(storeTitle) + '</div>',
		          '<div class="meta" style="margin-top:3px;">' + (e.itemId ? ('Item ' + escapeHtml(e.itemId)) : '') + '</div>',
		          '<div class="meta" style="margin-top:3px;">' + (e.discountPct != null ? ('Discount ' + Number(e.discountPct).toFixed(1) + '%') : '') + '</div>',
		          '<div style="margin-top:6px;">' +
		            (e.walmartLink ? '<a class="link-btn" href="' + escapeHtml(e.walmartLink) + '" target="_blank">Walmart</a>' : '') +
		            (e.keepaUrl ? '<a class="link-btn" style="margin-left:6px;" href="' + escapeHtml(e.keepaUrl) + '" target="_blank">Keepa</a>' : '') +
		            '</div>',
		          '</td>',
		          '<td class="num"><input data-receipt-qty="' + escapeHtml(e.receiptKey) + '" class="qty-input" type="number" min="1" step="1" inputmode="numeric" value="' + String(e.qty) + '" /></td>',
		          '<td class="num">' + fmtMoney(e.price) + '</td>',
		          '<td class="num">' + fmtMoney(cost) + '</td>',
		          '<td class="num">' + fmtMoney(unitSales) + '</td>',
		          '<td class="num">' + fmtMoney(sales) + '</td>',
		          '<td class="num"><button data-receipt-remove="' + escapeHtml(e.receiptKey) + '" class="toggle-btn" style="padding:6px 10px;">Remove</button></td>',
		          '</tr>',
		        ].join('');
		      }).join('');

		      receiptRoot.innerHTML = [
		        '<h3>Receipt (this trip)</h3>',
		        '<div class="receipt-totals">',
		        '<div class="receipt-total"><div class="k">Items checked</div><div class="v">' + String(entries.length) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Total qty</div><div class="v">' + String(totalQty) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Total cost</div><div class="v">' + fmtMoney(totalCost) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Est. sales</div><div class="v">' + fmtMoney(totalSales) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Est. profit</div><div class="v">' + fmtMoney(profit) + '</div></div>',
		        '</div>',
		        entries.length ? (
		          '<table class="receipt-table"><thead><tr>' +
		          '<th>Item</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Cost</th><th class="num">Unit sales</th><th class="num">Sales</th><th class="num"></th>' +
		          '</tr></thead><tbody>' + rows + '</tbody></table>'
		        ) : '<div class="meta">No items checked yet. Check “Add to receipt” on an item card.</div>'
		      ].join('');

		      Array.from(receiptRoot.querySelectorAll('input[data-receipt-qty]')).forEach((inp) => {
		        inp.addEventListener('input', () => {
		          const k = inp.getAttribute('data-receipt-qty');
		          const n = Number.parseInt(inp.value || '1', 10);
		          const q = Number.isFinite(n) && n > 0 ? n : 1;
		          receiptState.qty[k] = q;
		          saveReceiptStateSoon();
		          renderReceipt();
		        });
		      });
		      Array.from(receiptRoot.querySelectorAll('button[data-receipt-remove]')).forEach((btn) => {
		        btn.addEventListener('click', () => {
		          const k = btn.getAttribute('data-receipt-remove');
		          receiptState.bought[k] = false;
		          saveReceiptStateSoon();
		          renderReceipt();
		        });
		      });
		    }
    function renderGambles() {
      if (!gambleRoot) return;
      gambleRoot.innerHTML = '';
      if (!gambles.length) {
        const empty = document.createElement('div');
        empty.className = 'meta';
        empty.textContent = 'No Low/N/A gambles captured';
        gambleRoot.appendChild(empty);
        return;
      }
      gambles.forEach((r) => {
        const card = document.createElement('div');
        card.className = 'card';
        const walmartLink = r.itemId ? 'https://www.walmart.com/ip/' + r.itemId : (r.sourceLink || '#');
        const cardHtml = [
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">',
          '<h4>' + (r.storeLine || 'Store') + '</h4>',
          '<span class="tag gamble">Low/N/A gambles</span>',
          '</div>',
          '<div class="row"><span>Turbo price</span><span class="price">' + fmt(r.price) + '</span></div>',
          '<div class="row"><span>Floor stock</span><span class="pill">' + (r.floor ?? '–') + '</span></div>',
          '<div class="row"><span>Back stock</span><span class="pill">' + (r.back ?? '–') + '</span></div>',
          '<div class="row"><span>Aisles</span><span class="pill">' + (r.aisles || 'N/A') + '</span></div>',
          '<div class="row"><span>Item</span>',
          '<span class="pill">' + (r.itemId || '–') + '</span>',
          '<a class="pill link-btn" style="margin-left:8px;" href="' + walmartLink + '" target="_blank">Walmart link</a>',
          '</div>'
        ].join('');
        card.innerHTML = cardHtml;
        gambleRoot.appendChild(card);
      });
    }
    function applyFulfillmentUIFilter() {
      const mode = (fulfillmentFilter && fulfillmentFilter.value) || 'all';
      const cards = Array.from(root.querySelectorAll('.card'));
      cards.forEach((card) => {
        const hasPickup = !!card.querySelector('.tag.pickup');
        const hasDelivery = !!card.querySelector('.tag.delivery');
        let show = true;
        if (mode === 'pickup') show = hasPickup;
        else if (mode === 'delivery') show = hasDelivery;
        else if (mode === 'both') show = hasPickup && hasDelivery;
        card.style.display = show ? '' : 'none';
      });
    }

    const fulfillmentFilter = document.getElementById('fulfillment-filter');
    const _applyFilters = applyFilters;
    applyFilters = function () {
      _applyFilters();
      applyFulfillmentUIFilter();
    };

    applyFilters();
    renderGambles();
    discountFilter.addEventListener('input', applyFilters);
    floorFilter.addEventListener('input', applyFilters);
    backFilter.addEventListener('input', applyFilters);
    aisleFilter.addEventListener('change', applyFilters);
    storeFilter.addEventListener('change', applyFilters);
    if (fulfillmentFilter) fulfillmentFilter.addEventListener('change', applyFilters);
  </script>
