	          a.remove();
	          setTimeout(() => URL.revokeObjectURL(url), 1000);
	          toast('Downloaded CSV');
	        } catch (_) {}
	      }

	      const rows = entries.map((e) => {
		        const unitSales = (e.keepaPrice != null && Number.isFinite(Number(e.keepaPrice))) ? Number(e.keepaPrice)
		          : (e.marterPrice != null && Number.isFinite(Number(e.marterPrice))) ? Number(e.marterPrice)
		          : null;
		        const cost = (Number(e.price) || 0) * (e.qty || 0);
		        const sales = unitSales != null ? unitSales * (e.qty || 0) : null;
		        const storeTitle = e.storeLine || (e.storeId ? ('Store #' + e.storeId) : 'Store');
		        return [
		          '<tr>',
		          '<td>',
		          '<div style="font-weight:800;">' + esc(storeTitle) + '</div>',
		          '<div class="meta" style="margin-top:3px;">' + (e.itemId ? ('Item ' + esc(e.itemId)) : '') + '</div>',
		          '<div class="meta" style="margin-top:3px;">' + (e.discountPct != null ? ('Discount ' + Number(e.discountPct).toFixed(1) + '%') : '') + '</div>',
		          '<div style="margin-top:6px;">' +
		            (e.walmartLink ? '<a class="link-btn" href="' + esc(e.walmartLink) + '" target="_blank">Walmart</a>' : '') +
		            (e.keepaUrl ? '<a class="link-btn" style="margin-left:6px;" href="' + esc(e.keepaUrl) + '" target="_blank">Keepa</a>' : '') +
		            '</div>',
		          '</td>',
		          '<td>' + (e.channel ? ('<span class="pill">' + esc(e.channel) + '</span>') : '<span class="meta">–</span>') + '</td>',
		          '<td class="num"><input data-receipt-qty="' + esc(e.receiptKey) + '" class="qty-input" type="number" min="1" step="1" inputmode="numeric" value="' + String(e.qty) + '" /></td>',
		          '<td class="num">' + fmtMoney(e.price) + '</td>',
		          '<td class="num">' + fmtMoney(cost) + '</td>',
		          '<td class="num">' + fmtMoney(unitSales) + '</td>',
		          '<td class="num">' + fmtMoney(sales) + '</td>',
		          '<td class="num"><button data-receipt-remove="' + esc(e.receiptKey) + '" class="toggle-btn" style="padding:6px 10px;">Remove</button></td>',
		          '</tr>',
		        ].join('');
		      }).join('');

		      receiptRoot.innerHTML = [
		        '<h3>Receipt (this trip)</h3>',
		        '<div class="receipt-actions">' +
		          '<button id="receipt-copy" class="toggle-btn">Copy to Google Sheets</button>' +
		          '<button id="receipt-csv" class="toggle-btn">Download CSV</button>' +
		        '</div>',
		        '<div class="receipt-totals">',
		        '<div class="receipt-total"><div class="k">Items checked</div><div class="v">' + String(entries.length) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Total qty</div><div class="v">' + String(totalQty) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Total cost</div><div class="v">' + fmtMoney(totalCost) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Est. sales</div><div class="v">' + fmtMoney(totalSales) + '</div></div>',
		        '<div class="receipt-total"><div class="k">Est. profit</div><div class="v">' + fmtMoney(profit) + '</div></div>',
		        '</div>',
		        entries.length ? (
		          '<table class="receipt-table"><thead><tr>' +
		          '<th>Item</th><th>Marked in</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Cost</th><th class="num">Unit sales</th><th class="num">Sales</th><th class="num"></th>' +
		          '</tr></thead><tbody>' + rows + '</tbody></table>'
		        ) : '<div class="meta">No items checked yet. Check “Add to receipt” on an item card.</div>'
		      ].join('');

		      const copyBtn = document.getElementById('receipt-copy');
		      if (copyBtn) copyBtn.addEventListener('click', exportTsv);
		      const csvBtn = document.getElementById('receipt-csv');
		      if (csvBtn) csvBtn.addEventListener('click', exportCsv);

		      Array.from(receiptRoot.querySelectorAll('input[data-receipt-qty]')).forEach((inp) => {
		        inp.addEventListener('input', () => {
		          const k = inp.getAttribute('data-receipt-qty');
		          const n = Number.parseInt(inp.value || '1', 10);
		          const q = Number.isFinite(n) && n > 0 ? n : 1;
		          receiptState.qty[k] = q;
		          saveReceiptStateSoon();
		          renderReceipt();
		        });
		      });
			      Array.from(receiptRoot.querySelectorAll('button[data-receipt-remove]')).forEach((btn) => {
			        btn.addEventListener('click', () => {
			          const k = btn.getAttribute('data-receipt-remove');
			          receiptState.bought[k] = false;
			          delete receiptState.channel[k];
			          saveReceiptStateSoon();
			          renderReceipt();
			        });
			      });
			      setStatus('Receipt items: ' + String(entries.length));
			    }
	    function renderGambles() {
      if (!gambleRoot) return;
      gambleRoot.innerHTML = '';
      if (!gambles.length) {
        const empty = document.createElement('div');
        empty.className = 'meta';
        empty.textContent = 'No Low/N/A gambles captured';
        gambleRoot.appendChild(empty);
        return;
      }
      gambles.forEach((r) => {
        const card = document.createElement('div');
        card.className = 'card';
        const walmartLink = r.itemId ? 'https://www.walmart.com/ip/' + r.itemId : (r.sourceLink || '#');
        const cardHtml = [
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">',
          '<h4>' + (r.storeLine || 'Store') + '</h4>',
          '<span class="tag gamble">Low/N/A gambles</span>',
          '</div>',
          '<div class="row"><span>Turbo price</span><span class="price">' + fmt(r.price) + '</span></div>',
          '<div class="row"><span>Floor stock</span><span class="pill">' + (r.floor ?? '–') + '</span></div>',
          '<div class="row"><span>Back stock</span><span class="pill">' + (r.back ?? '–') + '</span></div>',
          '<div class="row"><span>Aisles</span><span class="pill">' + (r.aisles || 'N/A') + '</span></div>',
          '<div class="row"><span>Item</span>',
          '<span class="pill">' + (r.itemId || '–') + '</span>',
          '<a class="pill link-btn" style="margin-left:8px;" href="' + walmartLink + '" target="_blank">Walmart link</a>',
          '</div>'
        ].join('');
        card.innerHTML = cardHtml;
        gambleRoot.appendChild(card);
      });
    }
    function applyFulfillmentUIFilter() {
      const mode = (fulfillmentFilter && fulfillmentFilter.value) || 'all';
      const cards = Array.from(root.querySelectorAll('.card'));
      cards.forEach((card) => {
        const hasPickup = !!card.querySelector('.tag.pickup');
        const hasDelivery = !!card.querySelector('.tag.delivery');
        let show = true;
        if (mode === 'pickup') show = hasPickup;
        else if (mode === 'delivery') show = hasDelivery;
        else if (mode === 'both') show = hasPickup && hasDelivery;
        card.style.display = show ? '' : 'none';
      });
    }

    const fulfillmentFilter = document.getElementById('fulfillment-filter');
    const _applyFilters = applyFilters;
    applyFilters = function () {
      _applyFilters();
      applyFulfillmentUIFilter();
    };

    applyFilters();
    renderGambles();
    discountFilter.addEventListener('input', applyFilters);
    floorFilter.addEventListener('input', applyFilters);
    backFilter.addEventListener('input', applyFilters);
    aisleFilter.addEventListener('change', applyFilters);
    storeFilter.addEventListener('change', applyFilters);
    if (fulfillmentFilter) fulfillmentFilter.addEventListener('change', applyFilters);
  </script>
</body>
</html>
